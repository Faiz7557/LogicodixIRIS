[project]
name = "siapkemarau"
version = "0.1.0"
description = "Pipeline data SiapKemarau"
requires-python = ">=3.11,<3.14"
dependencies = [
  "geopandas>=1.1",
  "pyogrio>=0.11",
  "pandas>=2.2",
  "pyarrow>=17",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]

[tool.uv]
package = false
